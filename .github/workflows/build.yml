name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the exes to (e.g. v1.0.0)
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Browser UI smoke test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run test:ui

  windows:
    needs: test
    runs-on: windows-latest
    env:
      # Optional: a token for the public <repo>-releases repository. With it,
      # each new version merged to main is published there and installed
      # apps update themselves.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer and portable exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged app (UI, PDF reader, OCR)
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/win-unpacked -Filter "*.exe" | Where-Object { $_.Name -like "LOA*" } | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru -Wait -RedirectStandardOutput smoke.txt
          Get-Content smoke.txt
          if ($p.ExitCode -ne 0) { throw "Smoke test failed ($($p.ExitCode))" }
      - name: Check the update manifest was built
        shell: pwsh
        run: if (!(Test-Path release/latest.yml)) { throw "release/latest.yml is missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: LOA-Command-Center-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release/*.exe
      - name: Is this version already published for auto-update?
        id: pub
        if: github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          gh api "repos/${{ github.repository }}-releases/releases/tags/v$v" --silent 2>$null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; "v$v is already published" } else { "exists=false" >> $env:GITHUB_OUTPUT; "v$v is new" }
          $global:LASTEXITCODE = 0
      - name: Publish the update
        if: steps.pub.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.pub.outputs.version }}
          name: LOA Command Center v${{ steps.pub.outputs.version }}
          body: Installed copies update themselves. For a new install, download the Setup exe.
          files: |
            release/LOA-Command-Center-Setup-*.exe
            release/LOA-Command-Center-Setup-*.exe.blockmap
            release/LOA-Command-Center-Portable-*.exe
            release/latest.yml
          fail_on_unmatched_files: true
